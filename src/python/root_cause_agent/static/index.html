<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zava Root-Cause Agent</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .header p { font-size: 0.9rem; opacity: 0.8; }
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 16px;
        }
        .chip {
            background: var(--chip-bg, #eef2f7);
            border: 1px solid var(--chip-border, #d0d7e2);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text, #1f2933);
            transition: background 0.2s;
        }
        .chip:hover { background: var(--chip-hover, #dde5ef); }
        .thinking {
            color: var(--muted, #6b7280);
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>Zava Root-Cause Agent</h1>
            <p>Retail Performance Investigation · gpt-5.4-mini + Zava data</p>
        </div>

        <div class="suggestion-chips" id="suggestionChips">
            <button class="chip">Why did Zava's sales decline in 2023?</button>
            <button class="chip">Which stores drove the 2023 decline?</button>
            <button class="chip">Why did Power Tools sales decline in Seattle?</button>
            <button class="chip">Which categories grew in 2023?</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-container">
            <input type="file" id="fileInput" accept=".txt,.pdf,.doc,.docx,.md" style="display: none;" />
            <button id="fileBtn" title="Upload file">📎</button>
            <input type="text" id="messageInput" placeholder="Ask about Zava's retail performance..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="/static/chat.js"></script>
    <script>
        // Wire up suggestion chips
        document.getElementById('suggestionChips').addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                document.getElementById('messageInput').value = e.target.textContent;
                sendMessage();
            }
        });
    </script>
</body>
</html>
